# 주간 콘텐츠 사이클
#
# 첫 사업 목표는 자체 미디어 채널 성장이다. 이 레시피가 그 반복 단위다.
#
# 좌석 호출 1회의 하한이 약 19.4k 토큰·11초(실측)이므로 스텝 수를 아꼈다.
# 수다스러운 다회차 구조는 이 시스템에서 성립하지 않는다.
#
# publish 와 retro 스텝은 아직 구현되지 않았고, 엔진이 그것을 통과로
# 처리하지 않고 실패로 멈춘다. 조용한 성공을 만들지 않기 위한 의도된 동작이다.

name: weekly-content-cycle
schedule: 'MON 09:00'
description: 리서치 → 기획 → 초안 → 검증 → 비평 → 승인 → 발행 → 복기

steps:
  - id: research
    kind: seat
    title: 주간 트렌드 브리프
    persona: research
    produce: trend_brief
    instruction: |
      지난 7일 우리 카테고리의 화제를 정리해 트렌드 브리프를 작성하라.
      각 항목에 근거 출처를 붙이고, 근거가 없으면 unknown 으로 표시하라.
      추정으로 빈칸을 채우지 마라.

  - id: plan
    kind: seat
    title: 콘텐츠 기획
    persona: growth
    produce: content_plan
    instruction: |
      아래 트렌드 브리프를 근거로 이번 주 발행할 콘텐츠 3건을 기획하라.
      각 건에 채널, 핵심 메시지, 예상 성과 지표(저장/유입)를 적어라.
      예상치는 근거와 함께 적고, 근거가 없으면 그렇게 밝혀라.

      {{trend_brief}}

  - id: draft
    kind: seat
    title: 본문 초안
    persona: studio
    produce: draft
    instruction: |
      아래 기획의 첫 번째 항목을 실제 발행 본문으로 작성하라.
      링크는 브랜드 도메인만 사용하라. 출처 없는 수치를 쓰지 마라.

      {{content_plan}}

  # 결정론적 게이트. LLM 판단이 아니라 종료 코드로 판정한다.
  # 실제 검증 게이트는 Task 13 에서 sei 어댑터로 교체된다.
  - id: evidence-gate
    kind: gate
    title: 증거 게이트
    command: node -e "process.exit(0)"

  - id: critic
    kind: seat
    title: 교차 비평
    persona: critic
    produce: verdict
    # 본체와 다른 벤더 좌석을 강제한다. 같은 벤더면 브로커가 거부한다.
    forbidVendor: [openai]
    instruction: |
      아래 초안을 독립적으로 비평하라. PASS / CONCERN / BLOCK 중 하나로 판정하고
      근거를 제시하라. 브랜드 위반, 출처 없는 수치, 과장 표현을 특히 보라.

      {{draft}}

  - id: publish-approval
    kind: approval
    title: 발행 승인
    action: publish.threads
    subject: draft

  - id: publish
    kind: publish
    title: 쓰레드 발행
    channel: threads
    subject: draft

  - id: retro
    kind: retro
    title: 7일 후 복기
    afterDays: 7
    subject: draft
