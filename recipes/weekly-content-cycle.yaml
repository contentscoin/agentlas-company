# 주간 콘텐츠 사이클
#
# 첫 사업 목표는 자체 미디어 채널 성장이다. 이 레시피가 그 반복 단위다.
#
# 좌석 호출 1회의 하한이 약 19.4k 토큰·11초(실측)이므로 스텝 수를 아꼈다.
# 수다스러운 다회차 구조는 이 시스템에서 성립하지 않는다.
#
# publish 는 Task 9 에서, retro 는 R11 에서, studio 는 Task 18.3 에서 실물이 붙었다.
#
# retro 의 `expect` 는 필수다 — 예측 없는 복기는 사후 소감이지 복기가
# 아니다 (R11.6). `channel` 을 적으면 지표 어댑터가 실측을 읽어 예측과
# 견준다. 토큰이 없거나 수집이 실패하면 그 지표는 "수집 못 함" 으로 남고
# 복기의 첫 제안이 "먼저 측정을 고치세요" 가 된다 — 0 으로 채우면
# 레시피를 잘못 고치게 되므로 그렇게 하지 않는다.

name: weekly-content-cycle
schedule: 'MON 09:00'
description: 리서치 → 기획 → 초안 → 검증 → 비평 → 승인 → 발행 → 복기

steps:
  - id: research
    kind: seat
    title: 주간 트렌드 브리프
    persona: research
    produce: trend_brief
    instruction: |
      지난 7일 우리 카테고리의 화제를 정리해 트렌드 브리프를 작성하라.
      각 항목에 근거 출처를 붙이고, 근거가 없으면 unknown 으로 표시하라.
      추정으로 빈칸을 채우지 마라.

  - id: plan
    kind: seat
    title: 콘텐츠 기획
    persona: growth
    produce: content_plan
    instruction: |
      아래 트렌드 브리프를 근거로 이번 주 발행할 콘텐츠 3건을 기획하라.
      각 건에 채널, 핵심 메시지, 예상 성과 지표(저장/유입)를 적어라.
      예상치는 근거와 함께 적고, 근거가 없으면 그렇게 밝혀라.

      {{trend_brief}}

  # Studio 스텝은 좌석 산출에 더해 브랜드 대조와 결정론적 검증까지 한다.
  # 그 판정이 산출물 `draft` 에 묶여 발행 스텝까지 따라간다 — 그래서 발행에
  # `brandOk` 를 적을 필요가 없다 (Task 15.3, 18.3).
  #
  # 검증 BLOCK 이면 여기서 멈춘다. 나갈 수 없는 본문에 뒤 좌석 호출을 더
  # 쓰는 것은 낭비다 (1회 하한 19.4k 토큰).
  - id: draft
    kind: studio
    title: 본문 초안
    produce: draft
    # 브랜드 팩을 지정하지 않으면 규칙 없이 대조하고 그 사실이 판정에 남는다.
    # 팩이 준비되면 여기에 경로를 적는다.
    # pack: brand/pack.json
    brief: |
      아래 기획의 첫 번째 항목을 실제 발행 본문으로 작성하라.
      링크는 브랜드 도메인만 사용하라. 출처 없는 수치를 쓰지 마라.

      {{content_plan}}

  # 결정론적 게이트. LLM 판단이 아니라 종료 코드로 판정한다.
  # 실제 검증 게이트는 Task 13 에서 sei 어댑터로 교체된다.
  - id: evidence-gate
    kind: gate
    title: 증거 게이트
    command: node -e "process.exit(0)"

  - id: critic
    kind: seat
    title: 교차 비평
    persona: critic
    produce: verdict
    # 본체와 다른 벤더 좌석을 강제한다. 같은 벤더면 브로커가 거부한다.
    forbidVendor: [openai]
    instruction: |
      아래 초안을 독립적으로 비평하라. PASS / CONCERN / BLOCK 중 하나로 판정하고
      근거를 제시하라. 브랜드 위반, 출처 없는 수치, 과장 표현을 특히 보라.

      {{draft}}

  - id: publish-approval
    kind: approval
    title: 발행 승인
    action: publish.threads
    subject: draft

  - id: publish
    kind: publish
    title: 쓰레드 발행
    channel: threads
    subject: draft
    # brandOk 가 없다. `draft` 에 Studio 의 판정이 붙어 있고 발행 스텝은
    # 그것을 본다 — 실제로 대조한 결과를 레시피 선언으로 덮을 수 없다.

  - id: retro
    kind: retro
    title: 7일 후 복기
    afterDays: 7
    # 복기 대상은 발행 스텝이다 — 무엇의 성과인지가 분명해야 한다.
    subject: publish
    # 실측을 읽을 채널. 발행한 곳과 같아야 대조가 성립한다.
    channel: threads
    # 예측을 먼저 적는다. 이 숫자가 틀려도 괜찮다 — 틀린 예측과 실제를
    # 대조하는 것이 복기이고, 예측이 없으면 대조할 것이 없다.
    expect:
      views: 300
      likes: 20
      replies: 3
